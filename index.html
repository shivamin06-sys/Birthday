<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Priya 💖</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff5f6d,#ffc371);
font-family:'Segoe UI',sans-serif;
overflow:hidden;
color:white;
text-align:center;
}

button{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:40px;
background:#fff;
color:#ff4081;
cursor:pointer;
box-shadow:0 0 20px rgba(255,255,255,0.7);
}

#content{
display:none;
animation:fadeIn 2s ease forwards;
}

h1{
font-size:3rem;
}

p{
font-size:1.4rem;
}

@keyframes fadeIn{
from{opacity:0; transform:scale(0.6);}
to{opacity:1; transform:scale(1);}
}

.heart{
position:absolute;
font-size:24px;
animation:float 6s linear infinite;
}

@keyframes float{
from{transform:translateY(100vh); opacity:1;}
to{transform:translateY(-10vh); opacity:0;}
}
</style>
</head>

<body>

<button onclick="startMagic()">💝 Tap for Magic 💝</button>

<div id="content">
<h1>🎂 Happy Birthday Priya (Kaju) 🎉</h1>
<p>You make everything more beautiful just by being you ✨</p>
<p>Keep smiling, it suits you the most 😊</p>
<p>With love ❤️ — Shivam</p>
</div>

<script>
function startMagic(){
document.querySelector("button").style.display="none";
document.getElementById("content").style.display="block";

setInterval(()=>{
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤️";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*30)+"px";
document.body.appendChild(heart);

setTimeout(()=>{heart.remove()},6000);
},200);
}
</script>

</body>
</html>
